name: Security & Quality Pipeline (SAST)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  # ─── 1. Secret Scanning ─────────────────────────────────────────────────────
  secrets-scan:
    name: Secret Detection (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install and Run Gitleaks
        run: |
          GITLEAKS_VERSION="8.24.3"
          curl -sSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          # Scan repository git history cleanly without failing on root commit
          ./gitleaks git --log-opts="--all" --verbose --redact

  # ─── 2. Static Application Security Testing (SAST - OWASP Top 10) ───────────
  sast-scan:
    name: OWASP Top 10 SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Semgrep with OWASP Rules
        run: |
          python3 -m pip install --upgrade pip
          pip install semgrep
          # Scan application source code using OWASP Top 10 ruleset
          # Excludes CI configs (.github), agent rules/skills (.agents), and tests
          semgrep scan \
            --config "p/owasp-top-ten" \
            --config "p/security-audit" \
            --error \
            --exclude ".github/" \
            --exclude ".agents/" \
            --exclude ".githooks/" \
            --exclude "tests/"

  # ─── 3. Unified Security Gate ───────────────────────────────────────────────
  security-gate:
    name: Security Gate
    needs: [secrets-scan, sast-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate Security Pipeline Status
        run: |
          echo "Evaluating security pipeline status..."
          echo "Gitleaks Result: ${{ needs.secrets-scan.result }}"
          echo "Semgrep Result:  ${{ needs.sast-scan.result }}"

          if [ "${{ needs.secrets-scan.result }}" != "success" ] || [ "${{ needs.sast-scan.result }}" != "success" ]; then
            echo "::error::Security gate failed! One or more required security checks did not succeed."
            exit 1
          fi

          echo "✅ All required security checks passed successfully!"

