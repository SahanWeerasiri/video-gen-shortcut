name: Dynamic Security Scan (DAST - OWASP ZAP)

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target Application URL to scan (e.g. https://staging.example.com)'
        required: true
        type: string
  # Optional: Schedule weekly scans against a staging environment
  # schedule:
  #   - cron: '0 2 * * 0' # Weekly at 02:00 UTC on Sunday

permissions:
  contents: read
  issues: write # Allows ZAP to report findings if needed

jobs:
  zap_scan:
    name: OWASP ZAP DAST Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@2b5fc7f98d837319798ab7f128ea50b7d40563b6 # v0.14.0
        with:
          target: ${{ inputs.target_url }}
          rules_file_name: '.zap/rules.tsv' # Optional custom rules if configured
          cmd_options: '-a'
